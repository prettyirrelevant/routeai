[package]
name = "routeai"
version = "0.1.0"
edition = "2024"
description = "Route AI coding CLIs to isolated accounts by directory"
license = "MIT"
repository = "https://github.com/prettyirrelevant/routeai"
readme = "README.md"
keywords = ["claude", "codex", "cli", "profiles"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
